<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101112">
  <meta name="description" content="A private, local video library for your own files.">
  <title>Local YouTube</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
  <link rel="stylesheet" href="css/responsive.css?v=6">
</head>
<body>
  <div class="app-shell" id="appShell">
    <header class="topbar">
      <div class="brand-area">
        <button class="icon-button menu-button" id="sidebarToggle" aria-label="Toggle sidebar" title="Toggle sidebar"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <a class="brand" href="#home" aria-label="Local YouTube home"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="m9 6 10 6-10 6z"/></svg></span><span>Local <span>YouTube</span></span></a>
      </div>
      <div class="search-wrap">
        <label class="search-box" for="searchInput"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg><input id="searchInput" type="search" placeholder="Search your videos" autocomplete="off"><kbd>Ctrl K</kbd><button id="clearSearch" class="search-clear" aria-label="Clear search">×</button></label>
        <div class="search-suggestions" id="searchSuggestions" hidden></div>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="shuffleButton" title="Play a random video" aria-label="Play a random video"><svg viewBox="0 0 24 24"><path d="M4 7h3c4 0 6 10 10 10h3"/><path d="m17 14 3 3-3 3M4 17h3c1.4 0 2.4-1 3.2-2.2M14.8 9.2C15.6 8 16.6 7 18 7h2"/><path d="m17 4 3 3-3 3"/></svg></button>
        <button class="icon-button" id="refreshButton" title="Refresh library" aria-label="Refresh library"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.8-4L3 10"/><path d="M3 5v5h5M4 13a8 8 0 0 0 14.8 4L21 14"/><path d="M21 19v-5h-5"/></svg></button>
        <button class="icon-button" id="folderButton" title="Choose a video folder" aria-label="Choose a video folder"><svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M3 10h18"/></svg></button>
      </div>
      <input id="fileInput" type="file" accept="video/*,.mkv,.avi,.mov,.m4v" multiple hidden>
      <input id="subtitleInput" type="file" accept=".vtt,text/vtt" hidden>
    </header>

    <aside class="sidebar" id="sidebar">
      <nav class="primary-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
        <button class="nav-item" data-view="shorts"><svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="4"/><path d="m10 8 5 4-5 4z"/></svg><span>Shorts</span></button>
        <button class="nav-item" data-view="favorites"><svg viewBox="0 0 24 24"><path d="M20.8 8.8c0 5.1-8.8 11-8.8 11s-8.8-5.9-8.8-11A4.8 4.8 0 0 1 12 6.4a4.8 4.8 0 0 1 8.8 2.4Z"/></svg><span>Subscriptions</span></button>
        <button class="nav-item" data-view="history"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.3L3 8"/><path d="M3 3v5h5m4-1v5l3 2"/></svg><span>History</span></button>
        <button class="nav-item" data-view="playlists"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 11h11M4 16h8"/><path d="m17 15 4 2.5-4 2.5z"/></svg><span>Playlists</span></button>
        <button class="nav-item" data-view="library"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 9 5 3-5 3z"/></svg><span>Your videos</span></button>
        <button class="nav-item" data-view="liked"><svg viewBox="0 0 24 24"><path d="M7 10v10H4a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zm0 0 5-7a3 3 0 0 1 2 3l-1 4h6a2 2 0 0 1 2 2l-1 6a2 2 0 0 1-2 2H7"/></svg><span>Liked videos</span></button>
      </nav>
      <div class="sidebar-divider"></div>
      <div class="sidebar-section"><div class="sidebar-heading">YOUR LIBRARY <span class="library-count" id="sidebarCount">0</span></div><p class="sidebar-note" id="libraryHint">Your selected videos stay on this device.</p></div>
      <div class="sidebar-bottom"><button class="nav-item" data-view="settings"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1 1.4 1.1-1.5 2.6-1.7-.7a8 8 0 0 1-1.8 1l-.3 1.9h-3l-.3-1.9a8 8 0 0 1-1.8-1l-1.7.7-1.5-2.6 1.5-1.1a7 7 0 0 1 0-2l-1.5-1.1 1.5-2.6 1.7.7a8 8 0 0 1 1.8-1l.3-1.9h3l.3 1.9a8 8 0 0 1 1.8 1l1.7-.7 1.5 2.6-1.5 1.1a7 7 0 0 1 0 2Z"/></svg><span>Settings</span></button><div class="local-badge"><span></span> PRIVATE · ON THIS DEVICE</div></div>
    </aside>

    <main class="main-content" id="mainContent">
      <section id="browseView" class="browse-view">
        <div class="category-bar" id="categoryBar" aria-label="Video categories"></div>
        <section class="content-section">
          <div class="section-heading"><div><p class="eyebrow" id="viewEyebrow">YOUR LIBRARY</p><h1 id="viewTitle">Watch something good.</h1></div><div class="heading-actions"><label class="sort-control"><span>Sort by</span><select id="sortSelect" aria-label="Sort videos"><option value="recent">Recently added</option><option value="name">Name</option><option value="duration">Duration</option><option value="date">Date modified</option></select></label><button class="icon-button" id="newPlaylistButton" title="Create playlist" aria-label="Create playlist"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/><path d="M4 3h16v18H4z"/></svg></button></div></div>
          <div class="filter-summary" id="filterSummary"></div>
          <div class="video-grid" id="videoGrid"></div>
          <div class="empty-state" id="emptyState" hidden><div class="empty-art"><svg viewBox="0 0 96 96"><rect x="12" y="20" width="72" height="55" rx="8"/><path d="m41 35 21 13-21 13z"/><path d="M22 82h52"/></svg></div><h2 id="emptyTitle">Your library, your rules.</h2><p id="emptyMessage">Choose a folder to start building your personal collection.</p></div>
          <div class="load-more-wrap"><button class="button button-subtle" id="loadMoreButton" hidden>Show more videos</button></div>
        </section>
      </section>
      <section id="playerView" class="player-view" hidden></section>
      <section id="shortsView" class="shorts-view" hidden></section>
    </main>
  </div>
  <div id="toastRegion" class="toast-region" aria-live="polite"></div>
  <div id="modalRoot"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
